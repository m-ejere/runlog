<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Run | RunLog</title>
</head>
<body>

    <h1>RunLog</h1>

    <h2>Delete Run</h2>

    <p>
        Are you sure you want to delete this run?
    </p>

    <p>
        {{ run.date }} -
        {{ run.distance }} km -
        {{ run.duration }} -
        {{ run.get_run_type_display }}
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete Run</button>
    </form>

    <p>
        <a href="{% url 'home' %}">Cancel</a>
    </p>

</body>
</html>
