{% extends 'base.html' %}

{% block title %}Delete Run | RunLog{% endblock %}

{% block content %}

    <h2>Delete Run</h2>

    <p>
        Are you sure you want to delete this run?
    </p>

    <p>
        {{ run.date }} -
        {{ run.distance }} km -
        {{ run.duration }} -
        {{ run.get_run_type_display }}
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete Run</button>
    </form>

    <p>
        <a href="{% url 'home' %}">Cancel</a>
    </p>

{% endblock %}
